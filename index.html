<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FACE IA</title>
    <meta name="description" content="Générez des vidéos et images avec FACE IA." />
    <meta name="keywords" content="ia, face, video, image, generation" />
    <meta name="author" content="FACE IA" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FACE IA" />
    
    <!-- Icons -->
    <link rel="icon" href="https://ysbiedwkakdqadxtuwab.supabase.co/storage/v1/object/public/uploads/179cc21d-f672-40ea-b233-dcec904e3586.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="https://ysbiedwkakdqadxtuwab.supabase.co/storage/v1/object/public/uploads/179cc21d-f672-40ea-b233-dcec904e3586.jpg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="FACE IA" />
    <meta property="og:description" content="Générez des vidéos et images avec FACE IA." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ysbiedwkakdqadxtuwab.supabase.co/storage/v1/object/public/uploads/179cc21d-f672-40ea-b233-dcec904e3586.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FACE IA" />
    <meta name="twitter:description" content="Générez des vidéos et images avec FACE IA." />
    <meta name="twitter:image" content="https://ysbiedwkakdqadxtuwab.supabase.co/storage/v1/object/public/uploads/179cc21d-f672-40ea-b233-dcec904e3586.jpg" />
  </head>
  <body>
    <noscript>
      Veuillez activer JavaScript pour utiliser FACE IA.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('Service Worker enregistré avec succès:', registration.scope);
            }, function(err) {
              console.log('Échec de l\'enregistrement du Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
